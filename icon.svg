<linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#34d399"/>
  <stop offset="50%" stop-color="#10b981"/>
  <stop offset="100%" stop-color="#059669"/>
</linearGradient>

<linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#fb923c"/>
  <stop offset="100%" stop-color="#ea580c"/>
</linearGradient>

<filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
  <feGaussianBlur stdDeviation="10" result="blur" />
  <feComposite in="SourceGraphic" in2="blur" operator="over" />
</filter>


<!-- Left Leaf Accent (Orange Energy) -->
<path d="M 256 155 C 185 155 135 210 135 280 C 135 340 190 375 256 375 C 256 375 215 275 256 215 Z" fill="url(#orangeGrad)"/>

<!-- Center Vein / Route Line -->
<path d="M 256 375 L 256 125" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.95"/>

<!-- Sparkle / Sun Element -->
<circle cx="335" cy="160" r="16" fill="#fb923c" filter="url(#glow)" />
